name: Install protoc
description: >-
  Install a pinned protoc release for the runner's platform, verified by
  SHA-256, with no root privileges. Exports PROTOC with the installed path.
inputs:
  dest:
    description: >-
      Directory to install into (default $RUNNER_TEMP/protoc); a relative path
      is taken from the workspace. PROTOC and the path output are absolute.
    required: false
    default: ''
outputs:
  path:
    description: Absolute path of the installed protoc.
    value: ${{ steps.install.outputs.path }}
  version:
    description: The installed protoc version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        DEST: ${{ inputs.dest }}
      run: '"${{ github.action_path }}/../scripts/install-protoc.sh" "${DEST}"'

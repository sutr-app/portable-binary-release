name: Install cargo-about
description: >-
  Install a pinned cargo-about release for the runner's platform (Linux),
  verified by SHA-256, with no root privileges. Exports CARGO_ABOUT with the
  installed path.
inputs:
  dest:
    description: >-
      Directory to install into (default $RUNNER_TEMP/cargo-about); a relative
      path is taken from the workspace. CARGO_ABOUT and the path output are
      absolute.
    required: false
    default: ''
outputs:
  path:
    description: Absolute path of the installed cargo-about.
    value: ${{ steps.install.outputs.path }}
  version:
    description: The installed cargo-about version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        DEST: ${{ inputs.dest }}
      run: '"${{ github.action_path }}/../scripts/install-cargo-about.sh" "${DEST}"'
